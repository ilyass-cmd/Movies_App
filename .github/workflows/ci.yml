name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository; no secrets or write access are needed.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Next.js 16 needs Node >= 20.9.0; 24 matches the verified local runtime.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # npm ci is reproducible and fails if package.json and package-lock.json drift.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
